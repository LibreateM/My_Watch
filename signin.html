.ezy__signin4 {
  /* Bootstrap variables */
  --bs-body-color: #333b7b;
  --bs-body-bg: rgb(255, 255, 255);

  /* Easy Frontend variables */
  --ezy-theme-color: rgb(13, 110, 253);
  --ezy-theme-color-rgb: 13, 110, 253;
  --ezy-form-card-bg: #e7f6ff;
  --ezy-form-card-shadow: none;

  background-color: var(--bs-body-bg);
  overflow: hidden;
}

/* Gray Block Style */
.gray .ezy__signin4,
.ezy__signin4.gray {
  /* Bootstrap variables */
  --bs-body-bg: rgb(246, 246, 246);

  /* Easy Frontend variables */
  --ezy-form-card-bg: #dbf0fd;
  --ezy-form-card-shadow: 0 16px 24px rgba(209, 223, 247, 0.25);
}

/* Dark Gray Block Style */
.dark-gray .ezy__signin4,
.ezy__signin4.dark-gray {
  /* Bootstrap variables */
  --bs-body-color: #ffffff;
  --bs-body-bg: rgb(30, 39, 53);
  --bs-dark-rgb: 255, 255, 255;

  /* Easy Frontend variables */
  --ezy-form-card-bg: #253140;
  --ezy-form-card-shadow: none;
}

/* Dark Block Style */
.dark .ezy__signin4,
.ezy__signin4.dark {
  /* Bootstrap variables */
  --bs-body-color: #ffffff;
  --bs-body-bg: rgb(11, 23, 39);
  --bs-dark-rgb: 255, 255, 255;

  /* Easy Frontend variables */
  --ezy-form-card-bg: #162231;
  --ezy-form-card-shadow: none;
}

.ezy__signin4 .container {
  min-height: 100vh;
}

.ezy__signin4-heading {
  font-weight: bold;
  font-size: 25px;
  line-height: 25px;
  color: var(--bs-body-color);
}

.ezy__signin4-bg-holder {
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  min-height: 150px;
  width: 100%;
}

@media (min-width: 991px) {
  .ezy__signin4-bg-holder {
    width: 50vw;
  }
}

.ezy__signin4-form-card {
  background-color: var(--ezy-form-card-bg);
  border: none;
  box-shadow: var(--ezy-form-card-shadow);
  border-radius: 15px;
}

.ezy__signin4-form-card * {
  color: var(--bs-body-color);
}

.ezy__signin4 .form-control {
  min-height: 48px;
  line-height: 40px;
  border-color: transparent;
  background: rgba(163, 190, 241, 0.14);
  border-radius: 10px;
  color: var(--bs-body-color);
}

.ezy__signin4 .form-control:focus {
  border-color: var(--ezy-theme-color);
  box-shadow: none;
}

.ezy__signin4-btn-submit {
  padding: 12px 30px;
  background-color: #333b7b;
  color: #ffffff;
}

.ezy__signin4-btn-submit:hover {
  color: #ffffff;
}

.ezy__signin4-btn {
  padding: 12px 30px;
}

.ezy__signin4-btn,
.ezy__signin4-btn * {
  color: #ffffff;
}

.ezy__signin4-btn:hover {
  color: #ffffff;
}

.ezy__signin4-or-separator {
  position: relative;
}

.ezy__signin4-or-separator hr {
  border-color: var(--bs-body-color);
  opacity: 0.15;
}

.ezy__signin4-or-separator span {
  background-color: var(--ezy-form-card-bg);
  color: var(--bs-body-color);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate3d(-50%, -50%, 0);
  opacity: 0.8;
}
</style>

        <section class="ezy__signin4 light d-flex">
  <div class="container">
    <div class="row justify-content-between h-100">
      <div class="col-lg-6 py-5">
        <div class="row align-items-center h-100 px-lg-5">
          <div class="col-12">
            <div class="card ezy__signin4-form-card">
              <div class="card-body p-md-5">
                <h2 class="ezy__signin4-heading mb-3">Welcome to Easy Frontend</h2>
                <p class="mb-4 mb-md-5">
                  <span class="opacity-50 me-2">Don't have an account?</span>
                  <a href="#" class="btn btn-link p-0 text-dark text-decoration-none">Create account</a>
                </p>

                <form>
                  <div class="form-group mb-4 mt-2">
                    <label for="email" class="mb-2">Email Address</label>
                    <input type="text" class="form-control" id="email" placeholder="Enter Email Address" />
                  </div>
                  <div class="form-group mb-2 mt-2">
                    <label for="password" class="mb-2">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter Password" />
                  </div>
                  <div class="form-group mb-3">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" value="" id="remember-me" checked />
                      <label class="form-check-label" for="remember-me"> Remember me </label>
                    </div>
                  </div>
                  <button type="submit" class="btn ezy__signin4-btn-submit w-100">
                    Log In
                    <span class="fas fa-arrow-right ms-2 text-white"></span>
                  </button>
                  <button class="btn w-100">Forget your password?</button>

                  <div class="position-relative ezy__signin4-or-separator">
                    <hr class="my-4 my-md-5" />
                    <span class="px-2">Or</span>
                  </div>

                  <button class="btn btn-primary ezy__signin4-btn w-100 d-flex align-items-center mb-3">
                    <span class="fab fa-facebook text-white fs-4"></span>
                    <span class="w-100 text-center text-white">Continue with Facebook</span>
                  </button>
                  <button class="btn btn-danger ezy__signin4-btn w-100 d-flex align-items-center">
                    <span class="fab fa-google text-white fs-4"></span>
                    <span class="w-100 text-center text-white">Continue with Google</span>
                  </button>
                </form>
              </div>
